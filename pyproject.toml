[project]
name = "yasdef-orchestrator"
version = "0.1.0"
description = "Python orchestrator for the YASDEF worker workflow"
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
yasdef = "yasdef_orchestrator.cli.main:main"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yasdef_orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "yasdef_orchestrator.domain.*"
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
